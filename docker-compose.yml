services:

  fastapi:
    build: .
    container_name: policy-chatbot
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./policies_docx:/app/policies_docx  # policy documents
      - ./chroma_db:/app/chroma_db          # persistent vector store
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: chatbot-tunnel
    command: tunnel --no-autoupdate --no-tls-verify --url http://fastapi:5000
    depends_on:
      - fastapi
    restart: unless-stopped